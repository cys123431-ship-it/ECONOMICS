name: Windows Release
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - run: .\target\release\EconomicsRadar.exe rulebook
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\EconomicsRadar.exe dist\EconomicsRadar.exe
          Copy-Item README.md dist\README.md
          Copy-Item .env.example dist\.env.example
          Compress-Archive -Path dist\* -DestinationPath EconomicsRadar-Windows-x64.zip -Force
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: EconomicsRadar-Windows-x64.zip
          generate_release_notes: true
