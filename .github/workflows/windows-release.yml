name: Windows Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check src/dashboard.js
      - run: node scripts/dashboard_smoke.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --release
      - run: .\target\release\EconomicsRadar.exe rulebook
      - name: Determine release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"'
            if (-not $match) { throw "Cargo.toml version not found" }
            $version = $match.Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ARCHIVE=EconomicsRadar-$tag-Windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\EconomicsRadar.exe dist\EconomicsRadar.exe
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Copy-Item .env.example dist\.env.example
          Copy-Item rulebook dist\rulebook -Recurse
          Copy-Item config dist\config -Recurse
          Copy-Item docs dist\docs -Recurse
          Compress-Archive -Path dist\* -DestinationPath $env:RELEASE_ARCHIVE -Force
      - name: Verify packaged executable and rulebook
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaged | Out-Null
          Expand-Archive $env:RELEASE_ARCHIVE packaged -Force
          Push-Location packaged
          .\EconomicsRadar.exe rulebook
          .\EconomicsRadar.exe --help
          Pop-Location
      - name: Create GitHub Release if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          }
          gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ECONOMICS Radar $env:RELEASE_TAG" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
