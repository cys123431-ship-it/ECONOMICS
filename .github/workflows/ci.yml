name: Rust Bootstrap CI

on:
  push:
    branches: [ 'rust/**' ]
    paths: [ '.bootstrap-ready' ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize Rust source
        run: python tools/materialize_project.py
      - name: Materialize exact v4 ULTRA rulebook
        run: python tools/materialize_rulebook.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize formatting in CI workspace
        run: cargo fmt --all
      - name: Unit tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Verify embedded v4 ULTRA rulebook
        run: cargo run -- rulebook
