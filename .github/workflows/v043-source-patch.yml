name: v0.4.3 source patch
on:
  push:
    branches: [ fix/live-data-refresh-v0.4.3 ]
    paths: [ PATCH_V043 ]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run v0.4.3 source patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-data-refresh-v0.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/v043_patch.py
      - run: cargo fmt --all
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/collectors.rs src/dashboard.js Cargo.lock
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'fix: remove stale market data paths'
          git push origin HEAD:fix/live-data-refresh-v0.4.3
