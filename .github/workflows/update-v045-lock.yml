name: Update v0.4.5 lockfile
on:
  push:
    branches: [ fix/v0.4.5-lockfile ]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.4.5-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile package version
        run: cargo check --locked || cargo check
      - name: Commit Cargo.lock if changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "chore: sync Cargo.lock to v0.4.5"
          git push origin HEAD:fix/v0.4.5-lockfile
